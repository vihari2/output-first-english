<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Dashboard</title>
    <!-- Conectando o arquivo de design (CSS) -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dev-banner">
        Project still in development. Found a bug? Email me at <a href="mailto:vitoriafmq@gmail.com">vitoriafmq@gmail.com</a>
    </div>

    <div style="position: absolute; top: 15px; right: 15px;">
        <button id="logout-btn" onclick="signOut()" style="padding: 8px 15px; background-color: #dc2626; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9em;">Sign out</button>
    </div>

    <div class="bento-grid">
        <div class="card flashcards" onclick="abrirAnotacao('Flashcards')">
            🃏<br>Flashcards
        </div>

        <div class="card profile">
            <input type="file" id="upload-foto" accept="image/*" style="display: none;">
            <img src="https://ui-avatars.com/api/?name=User&background=random" id="foto-img" class="foto-perfil"
                title="Clique para mudar a foto">

            <div style="text-align: left; width: 100%;">
                <p style="margin: 0; font-size: 0.8em; color: #666;">Welcome,</p>
                <div contenteditable="true" id="nome-txt" class="nome-usuario" onblur="salvarNome()">Your Name Here</div>
            </div>
        </div>

        <div class="card meet" onclick="abrirAnotacao('Speaking Notes')">
            📹<br>Speaking<br>Notes
        </div>

        <div class="card coursebook" onclick="abrirAnotacao('My Coursebook')">
            📚<br>My Coursebook
        </div>

        <div class="card other" onclick="abrirAnotacao('Other Resources')">
            🧩<br>Other<br>Resources
        </div>
        <div class="card foto-gato-card">
            <input type="file" id="upload-gato" accept="image/*" style="display: none;">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80"
                id="img-gato" class="gato-estilo" title="Clique para trocar a foto do gato">
        </div>
        <div class="card journal" onclick="abrirAnotacao('Writing Journal')">
            ✍️<br>Writing Journal
        </div>
    </div>

    <!-- Janela Flutuante de Anotações -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-titulo">Título</h2>

            <!-- Esta div vai receber o texto ou a tabela dinamicamente -->
            <div id="modal-conteudo"></div>

            <button class="btn-fechar" onclick="fecharModal()">Close</button>
        </div>
    </div>

    <button id="btn-config-bg" title="Change Background" style="
    position: fixed;
    bottom: 70px; /* Um pouco acima do rodapé */
    right: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #ddd;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    cursor: pointer;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2em;
    color: #555;
    ">
    ⚙️
    </button>


    <div id="modal-config-bg" style="
    display: none;
    position: fixed; bottom: 120px; right: 20px;
    width: 250px; background: white;
    padding: 20px; border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    z-index: 1000;
    ">
    <h4 style="margin: 0 0 15px 0;">Customize Background</h4>
    
    <label style="display: block; margin-bottom: 10px;">
        <input type="radio" name="bg-type" value="color" checked onclick="toggleBgOption('color')"> Solid Color
    </label>
    
    <label style="display: block; margin-bottom: 10px;">
        <input type="radio" name="bg-type" value="image" onclick="toggleBgOption('image')"> Upload
    </label>
    
    <!-- Input de upload (escondido inicialmente) -->
    <div id="upload-container" style="display: none; margin-top: 10px;">
        <input type="file" id="img-upload-input" accept="image/png, image/jpeg" onchange="handleImageUpload(this)">
        <small style="display: block; color: #888; margin-top: 5px;">Max 5MB (PNG/JPG)</small>
    </div>
    
    <button onclick="closeConfigModal()" style="
        width: 100%; padding: 8px; background: #1a73e8; color: white;
        border: none; border-radius: 4px; margin-top: 15px; cursor: pointer;
    ">Fechar</button>
    </div>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Conectando o arquivo de lógica (JavaScript) -->
    <script src="script.js"></script>
    <!-- Botão flutuante de configurações -->
</body>

</html>
